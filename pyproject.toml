[project]
name = "scene-doctor"
version = "0.1.0"
description = "Houdiniシーンのジオメトリ欠陥・ノード構造・命名規則を自動検出するツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0,<6",
    "pytest-qt>=4.4,<5",
    "PySide6>=6.7,<7",
    "black>=24.0",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
    "jsonschema>=4.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scene_doctor*"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["scene_doctor/adapters/"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov=scene_doctor --cov=scene_doctor_cli --cov-report=term-missing"
testpaths = ["tests"]
# tests/fakes.py を `from tests.fakes import ...` で参照するため、
# 素の `pytest` 起動（`python -m pytest` を使わない場合）でもリポジトリルートを
# sys.path に含める。CI（.github/workflows/ci.yml）はまさにこの起動方法を使う。
pythonpath = ["."]

[tool.coverage.run]
# hou_adapter.py は、偽の hou(tests/fake_hou.py)の契約テストで計測する。
# houdini_panel_launch.py は hou.qt に依存するため、実機でのみ検証できる(ADR-0007)。
omit = ["scene_doctor/adapters/houdini_panel_launch.py"]
