name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Qt の実行ライブラリ（PySide6 が libEGL などを必要とする）"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: black --check .
      - run: isort --check .
      - run: flake8 scene_doctor/ scene_doctor_cli.py tests/ hda/ pdg/ scripts/
      - run: mypy scene_doctor/ scene_doctor_cli.py
      - name: "静的チェック: checks/配下がhouをimportしていないこと（FR-006 TC-021）"
        run: |
          if grep -rn "^import hou\|^from hou" scene_doctor/checks/; then
            echo "checks/ must not depend on hou directly"; exit 1
          fi
      - name: "静的チェック: シェルでプロセスを起動しないこと（shell=True / os.system）"
        run: |
          if grep -rnE "shell *= *True|os\.system\(|os\.popen\(" scene_doctor/ scene_doctor_cli.py hda/ pdg/ scripts/; then
            echo "the shell must not be used to start processes"; exit 1
          fi
      - name: "静的チェック: exec/evalの不使用（SEC-002）"
        run: |
          if grep -rn "exec(\|eval(" scene_doctor/ scene_doctor_cli.py; then
            echo "exec/eval must not be used"; exit 1
          fi
      - run: pytest --cov-fail-under=95
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pip-audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip PyYAML uv
      - name: The lock file matches pyproject.toml
        run: uv lock --check
      - name: Build the release zip and install it as a package
        run: |
          python scripts/build_release.py dist
          mkdir smoke && unzip -q dist/*.zip -d smoke
          cd smoke/scene-doctor-*
          python scene_doctor_cli.py --list-rules
          python install_package.py --prefs ../prefs
          test -f ../prefs/packages/scene_doctor.json
